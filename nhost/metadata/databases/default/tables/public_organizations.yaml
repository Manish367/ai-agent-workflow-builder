table:
  name: organizations
  schema: public

array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public

object_relationships:
  - name: stats
    using:
      manual_configuration:
        remote_table:
          name: organization_stats
          schema: public
        column_mapping:
          id: org_id

# Any member can see the org and its quota; only an owner can rename it. Quota columns are never in the update column list, so only the Action handler (admin secret) can change them.
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_start
        - created_at
        - updated_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id

update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check: null

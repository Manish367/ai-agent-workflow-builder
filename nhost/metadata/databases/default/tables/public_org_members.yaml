table:
  name: org_members
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      manual_configuration:
        remote_table:
          name: users
          schema: auth
        column_mapping:
          user_id: id

# Layer 1: any member of an org can see the org's member/role list (needed for the
# UI to show who has what role). Only an existing owner of that same org can add,
# change the role of, or remove a member — self-referential check through the
# `organization.members` relationship, so this can never cross into another org.
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - user_id
        - role
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id

insert_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - user_id
        - role
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner

update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check: null

delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner

table:
  name: org_members
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      manual_configuration:
        remote_table:
          name: users
          schema: auth
        column_mapping:
          user_id: id

# Any org member can see the member/role list; only an existing owner can add/change/remove one, via a self-referential check that can never cross into another org.
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - user_id
        - role
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id

insert_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - user_id
        - role
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner

update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check: null

delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner

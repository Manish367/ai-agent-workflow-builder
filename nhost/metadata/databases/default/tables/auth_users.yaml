table:
  name: users
  schema: auth

array_relationships:
  - name: org_memberships
    using:
      foreign_key_constraint_on:
        column: user_id
        table:
          name: org_members
          schema: public

# Tracked only so the creator/approver/user relationships resolve. Kept narrow: visible only to users sharing at least one org, never a global directory.
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - display_name
        - email
      filter:
        org_memberships:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id

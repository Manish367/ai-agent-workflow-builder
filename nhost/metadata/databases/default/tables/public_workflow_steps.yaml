table:
  name: workflow_steps
  schema: public

object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id

array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public

# Layer 1 + Layer 2 in one expression: db_write/notify need owner, everything else needs owner or editor. Insert checks through `workflow` since org_id isn't populated yet at check time (a DB trigger derives it from workflow_id); update/delete check through `organization` (org_id) directly.
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - step_order
        - type
        - name
        - config
        - created_at
        - updated_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id

insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_id
        - step_order
        - type
        - name
        - config
      check:
        _or:
          - _and:
              - type:
                  _nin: [db_write, notify]
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _in: [owner, editor]
          - workflow:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: owner

update_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - type
        - name
        - config
      filter:
        _or:
          - _and:
              - type:
                  _nin: [db_write, notify]
              - organization:
                  members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in: [owner, editor]
          - organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner
      check:
        _or:
          - _and:
              - type:
                  _nin: [db_write, notify]
              - organization:
                  members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in: [owner, editor]
          - organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner

delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _and:
              - type:
                  _nin: [db_write, notify]
              - organization:
                  members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in: [owner, editor]
          - organization:
              members:
                _and:
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: owner

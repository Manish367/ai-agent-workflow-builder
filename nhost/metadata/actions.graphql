scalar uuid

type TriggerWorkflowRunOutput {
  workflow_run_id: uuid!
  status: String!
}

type ApproveStepOutput {
  step_run_id: uuid!
  workflow_run_id: uuid!
  status: String!
}

type WebhookTriggerRunOutput {
  workflow_run_id: uuid!
  status: String!
}

input OrgMemberInput {
  email: String!
  role: String!
}

type AddOrgMemberResult {
  email: String!
  success: Boolean!
  user_id: uuid
  error: String
}

type AddOrgMembersOutput {
  results: [AddOrgMemberResult!]!
}

type CreateOrganizationOutput {
  org_id: uuid!
  org_name: String!
}

type Mutation {
  # Owner/editor + quota check happen inside the handler, not as a Hasura permission.
  triggerWorkflowRun(workflow_id: uuid!): TriggerWorkflowRunOutput

  # Resumes a paused approval_gate step; role check happens in the handler since it's a state transition, not a static row permission.
  approveStep(step_run_id: uuid!, approve: Boolean!): ApproveStepOutput

  # Unauthenticated (role: public) — external systems call this with the trigger's own secret instead of a user session.
  webhookTriggerRun(workflow_id: uuid!, secret: String!): WebhookTriggerRunOutput

  # Owner-only; looks up each email against auth.users and upserts a role — the only path onto an org's roster since there's no self-serve join or user directory.
  addOrgMembers(org_id: uuid!, members: [OrgMemberInput!]!): AddOrgMembersOutput

  # Any signed-up user can call this and becomes the new org's owner — organizations/org_members have no insert permission for role "user", so this is the only path onto the platform for someone nobody has invited yet.
  createOrganization(name: String!): CreateOrganizationOutput
}

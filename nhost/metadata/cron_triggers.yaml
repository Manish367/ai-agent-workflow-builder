# Polls every 5 minutes; the function checks each scheduled trigger's own cron expression against config.last_run_at to decide what's actually due.
- name: run_due_scheduled_workflows
  webhook: "{{ACTIONS_BASE_URL}}/scheduled/run-due-workflows"
  schedule: "*/5 * * * *"
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 3
    timeout_seconds: 60
    tolerance_seconds: 21600
  headers:
    - name: x-event-secret
      value_from_env: EVENT_TRIGGER_SECRET
  comment: Polls scheduled workflow_triggers and starts any that are due.

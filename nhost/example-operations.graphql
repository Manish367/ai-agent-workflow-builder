# Reference GraphQL operations the frontend uses against Hasura. Not tracked
# metadata — just documentation matching the assignment's "GraphQL Operations" list.

# 1. An org's workflows with their steps, triggers, and most recent run status.
query OrgWorkflows($org_id: uuid!) {
  workflows(where: { org_id: { _eq: $org_id } }, order_by: { created_at: desc }) {
    id
    name
    description
    created_at
    steps(order_by: { step_order: asc }) {
      id
      step_order
      type
      name
      config
    }
    triggers {
      id
      type
      config
      enabled
    }
    runs(order_by: { created_at: desc }, limit: 1) {
      id
      status
      trigger_type
      started_at
      finished_at
      created_at
    }
  }
}

# 2. Create a workflow with its steps and triggers (three plain mutations, run as one
# request via aliases — see frontend/lib/graphql/workflows.ts for the exact shape).
mutation CreateWorkflow($org_id: uuid!, $name: String!, $description: String) {
  insert_workflows_one(object: { org_id: $org_id, name: $name, description: $description }) {
    id
  }
}

mutation AddWorkflowStep($workflow_id: uuid!, $step_order: Int!, $type: step_type!, $name: String!, $config: jsonb!) {
  insert_workflow_steps_one(
    object: { workflow_id: $workflow_id, step_order: $step_order, type: $type, name: $name, config: $config }
  ) {
    id
  }
}

mutation AddWorkflowTrigger($workflow_id: uuid!, $type: trigger_type!, $config: jsonb!) {
  insert_workflow_triggers_one(object: { workflow_id: $workflow_id, type: $type, config: $config }) {
    id
  }
}

# 3. Approve (or reject) a paused approval_gate step — goes through the Action, not a
# direct table mutation, so the handler can check the approver's role AND resume
# execution in one atomic step.
mutation ApprovePausedStep($step_run_id: uuid!, $approve: Boolean!) {
  approveStep(step_run_id: $step_run_id, approve: $approve) {
    step_run_id
    workflow_run_id
    status
  }
}

# 4. Live step-by-step progress for one run, including the paused/awaiting-approval
# state (status = 'paused').
subscription StepRunProgress($workflow_run_id: uuid!) {
  step_runs(where: { workflow_run_id: { _eq: $workflow_run_id } }, order_by: { created_at: asc }) {
    id
    workflow_step_id
    status
    input
    output
    error
    attempt
    approved_by
    approved_at
    started_at
    finished_at
  }
}

# Start a run manually (hidden in the UI for viewers).
mutation TriggerRun($workflow_id: uuid!) {
  triggerWorkflowRun(workflow_id: $workflow_id) {
    workflow_run_id
    status
  }
}

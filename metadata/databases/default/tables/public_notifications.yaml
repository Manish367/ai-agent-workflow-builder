table:
  name: notifications
  schema: public

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id

select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - step_run_id
        - channel
        - message
        - sent
        - sent_at
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id

# `notify` step type, implemented as an Event Trigger rather than an inline call in
# the Action handler: the handler only ever INSERTs a row here (via admin secret).
# This trigger fires on that insert and calls the function that actually posts to
# Slack/email, then marks the row `sent`. Keeps the outbound side-effect decoupled,
# retryable independent of the run, and auditable as its own table.
event_triggers:
  - name: notification_outbox
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      num_retries: 3
      interval_sec: 15
      timeout_sec: 60
    webhook_from_env: NOTIFICATION_OUTBOX_WEBHOOK_URL
    headers:
      - name: x-event-secret
        value_from_env: EVENT_TRIGGER_SECRET
